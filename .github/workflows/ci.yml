name: Build and Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Build DynamicDesktop App
        run: |
          chmod +x build.sh
          BUILD_ARCH=arm64 ./build.sh

      - name: Test downloader
        run: python3 Tests/Downloader/run.py

      - name: Test wallpaper engine
        run: python3 Tests/WallpaperEngine/run.py

      - name: Verify App Bundle Structure
        run: |
          test -d "DynamicDesktop.app"
          test -x "DynamicDesktop.app/Contents/MacOS/DynamicDesktop"
          test -f "DynamicDesktop.app/Contents/Info.plist"
          test "$(lipo -archs DynamicDesktop.app/Contents/MacOS/DynamicDesktop)" = "arm64"
          vtool -show-build DynamicDesktop.app/Contents/MacOS/DynamicDesktop | grep -Eq 'minos[[:space:]]+14\.0(\.0)?([[:space:]]|$)'
          echo "App bundle verification passed!"

      - name: Archive App Bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent DynamicDesktop.app DynamicDesktop-macOS-arm64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicDesktop-macOS-arm64
          path: DynamicDesktop-macOS-arm64.zip
          retention-days: 14
